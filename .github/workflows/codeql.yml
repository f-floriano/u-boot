name: "CodeQL Advanced"

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libgnutls28-dev libsdl2-dev gcc-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        queries: ./.github/codeql/custom_taint_tracking.ql

    - name: Configure and Build U-Boot
      run: |
        make sandbox_defconfig
        # Compila con -k per consentire a CodeQL di estrarre l'AST di tutti i file di rete anche se il linking finale fallisce
        make -k -j$(nproc) KCFLAGS="-Wno-error" || true

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:cpp"
        upload: true
